submission:
  title: "Threat Intelligence Correlation & Alert Prioritisation Assistant" # REQUIRED

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Security and defence analysts receive thousands of alerts every day from SIEM systems, cyber sensors, intelligence feeds, and reports in different formats, making it difficult to identify genuine threats quickly. Missing a critical threat can have serious consequences, while investigating large numbers of false positives wastes valuable analyst time.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    We built an AI-powered Threat Intelligence Correlation & Alert Prioritisation Assistant that groups related alerts, assigns an explainable risk/priority score, maps suspicious activities to MITRE ATT&CK, and identifies the most important incidents for investigation. It then uses Gemini AI to generate a concise BLUF (Bottom Line Up Front) summary containing the threat, evidence, priority, MITRE techniques, and recommended actions for analysts and commanders.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Alert Correlation — Groups related security alerts based on common IPs, hostnames, usernames, and time windows."
    - "Explainable Risk Scoring — Calculates a 0–100 risk score and classifies incidents as Critical, High, Medium, or Low with clear reasons."
    - "MITRE ATT&CK Mapping — Maps suspicious activities to relevant MITRE ATT&CK techniques such as PowerShell, Phishing, and Credential Dumping."
    - "AI-Powered BLUF Generation — Uses Gemini AI to generate a concise Bottom Line Up Front (BLUF) containing the threat, evidence, priority, MITRE techniques, and recommended actions."
    - "Prioritized Threat Dashboard — Presents the most important incidents first, helping analysts focus on high-priority threats and reduce alert overload."

  tech_stack:
    languages: ["Python", "JavaScript", "HTML", "CSS"] # REQUIRED
    frameworks: ["FastAPI", "React.js"]
    ibm_technologies: ["IBM Bob"]
    ai_apis: ["Google Gemini API", "Google GenAI SDK"]
    databases: ["None — file-based prototype"]
    other: ["Git", "GitHub", "GitHub Actions", "CSV", "MITRE ATT&CK"]

  what_we_are_most_proud_of: >         # Optional but recommended
    Automated correlation engine combining rule-based heuristics with Gemini AI for instant threat summarization and explainable risk scoring.

  known_limitations: >                 # Optional but recommended
    File-based prototype using sample CSV data rather than real-time SIEM network streams.

